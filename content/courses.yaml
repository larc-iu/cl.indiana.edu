instructors:
  "Luke Gessler": "https://lgessler.com"
  "Francis M. Tyers": "http://xixona.dlsi.ua.es/~fran/"
  "Sandra Kuebler": "/~skuebler/"
  "Damir Cavar": "http://cavar.me/damir/"
  "Shuju Shi": "https://linguistics.indiana.edu/about/faculty/shuju-shi.html"

semesters:
  fall_2026:
    - code: "LING-L 235 / LING-L 555"
      title: "Foundational Skills in Computational Linguistics / Programming for Computational Linguistics"
      instructor: "Luke Gessler"
      description: "This course is geared towards students in Computational Linguistics and Linguistics, with little or no experience in programming. It introduces the fundamentals of programming and computer science, aiming at attaining practical skills for text processing. In contrast to similar courses in Computer Science, we will concentrate on problems in Computational Linguistics, which involve managing text, searching in text, and extracting information from text."
    - code: "LING-L 245"
      title: "Language and Computers"
      instructor: "Sandra Kuebler"
      description: "#BlackLivesMatter, and how we talk about this issue matters, too. Abusive language in social media is a serious issue, and because so many posts are made every day, we cannot remove abusive posts by hand, their removal must be automated. How does automatic detection work? We will discuss what abusive language is and consider how it differs based on the group it addresses (e.g. sexism, racism). Then we'll learn about automatic approaches to language analysis (i.e. what is behind Siri or Alexa), and learn just a bit of programming. By the end of the course, you will develop, experiment with, and assess your own method for automatic detection of abusive posts."
    - code: "LING-L 645"
      title: "Advanced Natural Language Processing"
      instructor: "Damir Cavar"
      description: "Symbolic, statistical, and neural methods are at the core of Computational Linguistics and Natural Language Processing (NLP) research and applications. This course introduces advanced methods for NLP based on statistical modeling, machine learning algorithms, including neural network and Deep Learning approaches, bringing them together with symbolic and knowledge-based approaches. We aim at bridging between research in language and linguistic areas and application of NLP and linguistic technologies from the computer and information science perspective."
    - code: "LING-L 665"
      title: "Applying Machine Learning Techniques in Computational Linguistics"
      instructor: "Damir Cavar"
      description: "This course is an introduction to machine learning (ML) methods for computational linguistics (CL). We begin by covering basic concepts in ML before turning to foundational ML methods in CL. Throughout, students develop practical skills in ML programming in Python, using libraries such as NumPy, PyTorch, and scikit-learn. By the end of the course, students will have an understanding of the mathematical details underlying modern models used in CL, and will have practical skills for creating and using ML models for CL."
    - code: "LING-L 675"
      title: "Advanced Machine Learning for Computational Linguistics"
      instructor: "Damir Cavar"
      description: "Advanced Machine Learning for CL focuses on new methods in CL based on Generative AI, Graph representations and Knowledge Graphs for semantic modeling, and Graph Neural networks. The topics discussed include also tuning of Large Language Models and LLMs with RAGs."
    - code: "LING-L 715"
      title: "Seminar: Linguistic Behavior in Language Models"
      instructor: "Luke Gessler"
      description: "Large language models (LLMs) are capable of producing natural language fluently. In this seminar, we investigate various questions pertaining to this capacity, such as how linguistic knowledge is encoded mechanistically in LLMs, and whether linguistic knowledge in LLMs can be viewed as encoded grammatical analyses and decoded into a human-interpretable form. Students will spend the bulk of their time working on a project of their choosing related to LLMs. By the end of the course, students will have an understanding of both the inner workings of LLMs and their broader significance in academia and society."
  spring_2026:
    - code: "LING-L 245"
      title: "Language and Computers"
      instructor: "Luke Gessler"
      description: "Computer systems that process human language have become ubiquitous in modern life. This course surveys modern language technologies, which may include writing systems, writing assistants, language learning assistants, text classifiers, search engines, machine translation systems, and large language models such as ChatGPT. For the technologies covered, we explore how they function, emphasizing insights from linguistics, and discuss the ethical and social consequences of their use. No technical background is assumed."
    - code: "LING-L 445 / LING-L 545"
      title: "The Computer and Natural Language / Computation and Linguistic Analysis"
      instructor: "Sandra Kuebler"
      description: "This course provides an introduction to natural language processing and computational linguistics. It is concerned with concepts, models, and algorithms to analyze and generate natural languages automatically. It will also look at NLP applications. We will look at sentiment analysis, and how to model information that is required for a machine learning approach. Thus, we will discuss different levels of linguistic analysis: morphology, morpho-syntax, syntax, and lexical semantics. In that process, we will move from simple representations of language, such as finite-state techniques and n-gram analysis, to more advanced representations, including word embeddings."
    - code: "LING-L 565"
      title: "Fundamentals of Speech Processing"
      instructor: "Shuju Shi"
      description: "An introduction to acoustic signal processing, focusing on the representation and analysis of continuous and discrete-time speech signals. Topics include phasors, sampling, FIR filters, the discrete-time Fourier transform, spectrum, and spectrogram analysis."
    - code: "LING-L 605"
      title: "Advanced Data Modeling for Computational Linguistics"
      instructor: "Luke Gessler"
      description: "In this course, students will develop their practical programming skills in Python while gaining familiarity with algorithms and data structures that are foundational for computational linguistics. Topics covered include linked lists, queues and stacks, tree-based data structures, tree-based algorithms, sorting algorithms, graphs, and search algorithms."
    - code: "LING-L 675"
      title: "Advanced Machine Learning for Computational Linguistics"
      instructor: "Damir Cavar"
      description: "Advanced Machine Learning for CL focuses on new methods in CL based on Generative AI, Graph representations and Knowledge Graphs for semantic modeling, and Graph Neural networks. The topics discussed include also tuning of Large Language Models and LLMs with RAGs."
    - code: "LING-L 715"
      title: "Seminar in Computational Linguistics"
      instructor: "Shuju Shi"
      description: "This course investigates the acoustic, phonetic, and statistical analysis of atypical speech, with a focus on accented and dysarthric speech. We will explore how speech variability affects intelligibility, survey corpora and annotation practices, and review modeling approaches ranging from traditional acoustic analysis to modern neural architectures. Students will lead discussions, analyze real datasets, and complete a final project that develops a computational model or empirical study of atypical speech."
  fall_2025:
    - code: "LING-L 235 / LING-L 555"
      title: "Foundational Skills in Computational Linguistics / Programming for Computational Linguistics"
      instructor: "Luke Gessler"
      description: "This course is geared towards students in Computational Linguistics and Linguistics, with little or no experience in programming. It introduces the fundamentals of programming and computer science, aiming at attaining practical skills for text processing. In contrast to similar courses in Computer Science, we will concentrate on problems in Computational Linguistics, which involve managing text, searching in text, and extracting information from text."
    - code: "LING-L 245"
      title: "Language and Computers"
      instructor: "Sandra Kuebler"
      description: "Present-day computer systems work with human language. This course surveys issues relating natural language to computers, covers real-world applications, and provides practical experience with natural language on computers. Topics include text encoding, search technology, machine translation, dialogue systems, computer-aided language learning, and the social context of technology."
    - code: "LING-L 545"
      title: "Computation and Linguistic Analysis"
      instructor: "Shuju Shi"
      description: "This course is a graduate course that provides an introduction to natural language processing and computational linguistics. The course focuses on key concepts, models, and algorithms for the automatic analysis and generation of natural language, with a look at real-world NLP applications."
    - code: "LING-L 635"
      title: "Applications of Speech Processing"
      instructor: "Shuju Shi"
      description: "This course explores advanced topics and current trends in speech processing, focusing on applications in areas such as speech recognition, synthesis, and speech enhancement. The course will cover both theoretical foundations and practical implementation aspects, including recent advances in machine learning and deep learning as applied to speech processing."
    - code: "LING-L 645"
      title: "Advanced Natural Language Processing"
      instructor: "Damir Cavar"
      description: "An introduction to statistical models and machine learning paradigms in NLP. Covers basic notions in probability and information theory, focusing on the concepts needed for NLP, including Markov Models. Additional topics may include word sense disambiguation, text categorization, and statistical alignment methods and their use in machine translation."
    - code: "LING-L 665"
      title: "Applying Machine Learning Techniques in Computational Linguistics"
      instructor: "Luke Gessler"
      description: "An introduction to machine learning (ML) methods for computational linguistics (CL). We begin by covering basic concepts in ML before turning to foundational ML methods in CL. Throughout, students develop practical skills in ML programming in Python, relying on libraries such as NumPy, PyTorch, and scikit-learn. Students will develop an understanding of the mathematical details underlying modern models used in CL, and will have practical skills for creating and using ML models for CL."
    - code: "LING-L 715"
      title: "Seminar: Knowledge Graphs, Large Language Models, RAGs, and Graph-based Reasoning"
      instructor: "Damir Cavar"
